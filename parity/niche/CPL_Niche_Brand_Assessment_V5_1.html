<!DOCTYPE html><html><head><meta charset="utf-8"><title>CPL Niche Brand Assessment V5.1</title><style>
body{font-family:Montserrat,Arial,sans-serif;background:#F4F1FB;margin:0;padding:30px;color:#222}
.container{max-width:1250px;margin:auto;background:#fff;border-radius:24px;padding:34px;box-shadow:0 12px 32px rgba(77,38,170,.15)}
.header{display:flex;align-items:center;gap:28px;margin-bottom:20px}
.logo{width:190px;height:190px;background:#5A31D6;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.logo .cpl{font-size:82px;font-weight:800;line-height:0.9}.logo .ar{font-size:26px;letter-spacing:9px}
h1{color:#5A31D6;margin:0}.subtitle{color:#666}.section{background:#FBFAFF;border-left:8px solid #5A31D6;border-radius:12px;padding:18px;margin:20px 0}
.section h3{margin:0;color:#5A31D6}.section p{font-style:italic;color:#666}
.q{padding:12px 0;border-bottom:1px solid #ece7fb;font-size:16px}
.progress{height:22px;background:#ddd;border-radius:30px;overflow:hidden}.bar{height:100%;width:0;background:#5A31D6}
.gauge span{font-size:36px;opacity:.25}.result{margin-top:15px;padding:18px;border-radius:12px;color:#fff;font-weight:700}.btn{padding:12px 18px;border:none;border-radius:8px;color:white;font-weight:700}.p{background:#5A31D6}.g{background:#28a745}
input[type=text]{padding:8px;width:220px}
</style></head><body><div class='container'><div class='header'><div class='logo'><div class='cpl'>CPL</div><div class='ar'>AROMAS</div></div><div><h1>Niche Brand Assessment</h1><div class='subtitle'>Strategic framework for qualifying niche fragrance and beauty brands.</div></div></div>
<p>Brand <input type='text'> Assessor <input type='text'> Date <input type='date'></p>
<h3 style='color:#5A31D6'>Assessment Progress</h3><div class='progress'><div id='bar' class='bar'></div></div><div id='pct'>0% Complete</div><div class='gauge'><span id='r'>🔴</span><span id='o'>🟠</span><span id='y'>🟡</span><span id='g1'>🟢</span></div><div id='qs'></div><h2>Executive Recommendation</h2><div id='score'>0 / 100</div><div id='res' class='result' style='background:#777'>Complete assessment</div><h3 style='color:#5A31D6'>Reviewer Comments</h3><textarea placeholder='Optional comments for future reviewers' style='width:100%;min-height:120px;padding:10px;border:1px solid #d9d3f5;border-radius:8px;box-sizing:border-box;'></textarea><br><br><button class='btn p'>Submit Assessment</button> <button class='btn g' onclick='window.print()'>Save / Export PDF</button></div>
<script>
const data=[['Financial Value','Assess the commercial viability and revenue potential of the brand.',['Chance of becoming £100K+ account within 2-3 years|14','Chance of becoming £50K+ account within 2 years|9','Able to provide a clear 12-month volume forecast|5','Would working with this brand support other strategic accounts?|5','Currently trading in the market?|4','Agreeing to minimum 10kg PO orders with surcharge|3']],['Brand Image & PR','Evaluate strategic brand fit, differentiation and reputation potential.',['Do they offer market concept differentiation (first mover/unique proposition)?|5','Current press credibility or future PR potential?|5','Can they support a CPL technology?|5','Credible founder with fragrance/beauty industry experience?|9','Do they have own-brand stores?|6']],['Growth Potential','Assess future expansion opportunities and long-term scalability.',['Strong current or future distribution/expansion plan?|10','Do they have multi-launch ambitions?|8','Investor(s) behind the business?|12']]];
let total=0;data.forEach(s=>{let d=document.createElement('div');d.className='section';d.innerHTML='<h3>'+s[0]+'</h3><p>'+s[1]+'</p>';s[2].forEach(q=>{let p=q.split('|');total++;d.innerHTML+=`<div class=q><label><input type=checkbox data-p='${p[1]}' onchange='calc()'> ${p[0]}</label></div>`});qs.appendChild(d)});
function calc(){let t=0,c=0;document.querySelectorAll('[data-p]').forEach(x=>{if(x.checked){t+=+x.dataset.p;c++}});score.innerHTML='<b>'+t+' / 100</b>';bar.style.width=(c/total*100)+'%';pct.innerText=Math.round(c/total*100)+'% Complete';[r,o,y,g1].forEach(x=>x.style.opacity=.25);let bg,msg;if(t>=80){bg='#28a745';msg='Tier 1 - Strategic Niche Partner | APPROVE';g1.style.opacity=1}else if(t>=55){bg='#FFC107';msg='Tier 2 - Growth Niche Partner';y.style.opacity=1}else if(t>=35){bg='#FD7E14';msg='Charging Model / Junior Perfumer Development Opportunity / Perfumer Passion Project';o.style.opacity=1}else{bg='#DC3545';msg='Charging Model / Decline';r.style.opacity=1}res.style.background=bg;res.innerText=msg;}calc();
</script></body></html>
